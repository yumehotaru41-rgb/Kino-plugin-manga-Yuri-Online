name: fix-icon
on: [push]
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d icon.b64 > icon.png
          file icon.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add icon.png
          git commit -m "icono 96x96 PNG transparente (fix binario)" || echo "sin cambios"
          git push
